<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster (Simplified)</title>
    <style>
        /* Minimal styles for responsive management table and spinners */
        body{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding:16px; background:#0B0E14;color:#E8ECF4}
        .card{background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;margin-bottom:12px}
        .data-table{width:100%;border-collapse:collapse}
        .data-table th,.data-table td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03)}
        .badge-folder{display:inline-block;padding:4px 8px;background:#222;border-radius:6px;color:#ddd;font-size:0.85rem}
        .btn-danger{background:#FF5252;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
        .controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
        .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--accent-1,#6C5CE7);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Button styles */
        .btn{border:0;padding:8px 12px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,0.04);color:inherit}
        .btn-primary{background:linear-gradient(90deg,#FF6B6B,#FF8E53);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(255,107,107,0.12);border-radius:10px}
        .btn-secondary{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.03);color:#ddd}
        .start-large{font-size:1rem;padding:12px 18px;border-radius:12px}

        /* Make the primary start button more prominent on small screens */
        .start-cta{display:flex;gap:8px;align-items:center}

        /* Responsive cards for narrow screens */
        @media (max-width:640px){
            .data-table thead{display:none}
            .data-table tr{display:block;margin-bottom:12px;border-radius:8px;background:rgba(255,255,255,0.02);padding:8px}
            .data-table td{display:flex;justify-content:space-between;padding:6px 0;border:none}
            .controls{flex-direction:column;align-items:stretch}
            button{min-height:44px}
            .start-large{width:100%;font-size:1.05rem}
        }
        /* Simple toast */
        .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;padding:10px 16px;border-radius:8px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h1>VocabMaster — 管理</h1>
        <div style="display: flex; gap: 8px; align-items:center;">
            <a href="/morphology" style="color: #6C5CE7; text-decoration: none; padding: 8px 12px; background: rgba(108, 92, 231, 0.1); border-radius: 6px; border: 1px solid rgba(108, 92, 231, 0.3);">
                🧩 構詞學習
            </a>
            <a href="/ai-learning" style="color: #FF6B6B; text-decoration: none; padding: 8px 12px; background: rgba(255, 107, 107, 0.1); border-radius: 6px; border: 1px solid rgba(255, 107, 107, 0.3);">
                🤖 AI智慧學習
            </a>
            <!-- Prominent global start button for quick access -->
            <button id="globalStart" class="btn btn-primary start-large" style="margin-left:8px" aria-label="開始學習" title="開始學習 (快速)" onclick="loadFlashcards();">開始學習</button>
        </div>
    </div>

    <div class="card">
        <div class="controls">
            <label for="mgmtFolder">資料夾</label>
            <select id="mgmtFolder" aria-label="管理資料夾選單"><option value="all">全部資料夾</option></select>
            <div style="margin-left:auto" id="mgmtCount"></div>
            <div id="mgmtSpinner" style="display:none"><span class="spinner" aria-hidden="true"></span></div>
        </div>

        <div class="controls">
            <label for="mgmtPageSize">頁面大小</label>
        <select id="mgmtPageSize" aria-label="管理頁面大小"><option>10</option><option>20</option><option>50</option><option>100</option></select>
            <div>
                <button id="mgmtPrev">Prev</button>
                <span id="mgmtPageInfo"></span>
                <button id="mgmtNext">Next</button>
            </div>
        </div>

        <table class="data-table" aria-describedby="mgmtCount">
            <thead>
                <tr><th>英文</th><th>中文</th><th>資料夾</th><th>構詞</th><th>錯誤</th><th>操作</th></tr>
            </thead>
            <tbody id="mgmtTableBody"></tbody>
        </table>
    </div>

    <div class="card">
        <label for="searchInput">搜尋</label>
        <input id="searchInput" autocomplete="off" aria-label="Search words" />
        <div id="searchDropdown" role="listbox" aria-label="搜尋結果" style="display:none;background:#111;margin-top:8px;padding:8px;border-radius:6px;max-height:320px;overflow:auto"></div>
    </div>

    <div class="card">
        <h2>Flashcards</h2>
        <div id="todayStudy" style="margin-top:6px">
            <small id="fcHelper" style="color:#aaa;display:block;margin-bottom:6px">選擇方向後開始學習（點擊「開始學習」以顯示選項）</small>
            <button id="fcStart" class="btn btn-primary start-large" aria-label="開始學習">開始學習</button>
            <select id="fcFolder" aria-label="Flashcards 資料夾選單" style="display:none;margin-left:8px"></select>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <button id="fcLoad" class="btn btn-secondary">載入</button>
            <button id="fcLoadDue" class="btn btn-secondary">載入 Due 單字</button>
        </div>
        <div id="fcSpinner" style="display:none;margin-top:8px"><span class="spinner" aria-hidden="true"></span></div>
        <div id="fcArea" style="margin-top:8px"></div>
    </div>

    <script>
    // Small utility: toast
    function toast(msg, type=''){
        const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),3000);
    }

    // Robust API wrapper per plan
    async function api(url, opts = {}){
        const defaultTimeout = opts.timeout || 10000;
        const controller = new AbortController();
        const timeout = setTimeout(()=>controller.abort(), defaultTimeout);

        const headers = new Headers(opts.headers || {});
        const method = (opts.method || 'GET').toUpperCase();
        if(method !== 'GET' && method !== 'HEAD'){
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
            if(csrf) headers.set('X-CSRF-Token', csrf);
            const apiToken = localStorage.getItem('vm_api_token');
            if(apiToken) headers.set('Authorization', 'Bearer ' + apiToken);
        }

        try{
            const res = await fetch(url, {...opts, headers, signal: controller.signal});
            clearTimeout(timeout);
            if(!res.ok){
                let body = null;
                try{ body = await res.json(); } catch(e){ body = await res.text().catch(()=>null); }
                const err = new Error('API Error: '+res.status);
                err.status = res.status; err.body = body; throw err;
            }
            const ct = res.headers.get('Content-Type') || '';
            if(ct.includes('application/json')){
                const json = await res.json();
                return { body: json, status: res.status, headers: res.headers };
            }
            const text = await res.text();
            return { body: text, status: res.status, headers: res.headers };
        }catch(err){
            if(err.name === 'AbortError') throw new Error('Request timed out');
            throw err;
        }
    }
    async function apiGet(url, opts = {}){
        const r = await api(url, opts);
        return r.body;
    }

    // Load folder select helper
    async function loadFolderSelect(id){
        try{
            const folders = await apiGet('/api/folders');
            const sel = document.getElementById(id);
            if(!sel) return;
            const val = sel.value || 'all';
            sel.innerHTML = '';
            sel.appendChild(Object.assign(document.createElement('option'),{value:'all',text:'全部資料夾'}));
            folders.forEach(f=>{ const o = document.createElement('option'); o.value = f; o.textContent = f; sel.appendChild(o); });
            sel.value = val;
        }catch(e){ console.error(e); toast('載入資料夾失敗','error'); }
    }

    // Management with pagination
    let mgmtState = {page:1, limit:10, total:0};
    async function loadManagement(){
        const folder = document.getElementById('mgmtFolder').value || 'all';
        const spinner = document.getElementById('mgmtSpinner'); spinner.style.display='inline-block';
        try{
            const qs = `?folder=${encodeURIComponent(folder)}&page=${mgmtState.page}&limit=${mgmtState.limit}`;
            const data = await apiGet('/api/words'+qs);
            mgmtState.total = data.total || 0;
            document.getElementById('mgmtCount').textContent = `${mgmtState.total} 個字`;
            document.getElementById('mgmtPageInfo').textContent = `第 ${data.page} 頁 / 共 ${Math.ceil(mgmtState.total/mgmtState.limit)||1}`;
            const tbody = document.getElementById('mgmtTableBody');
            const rows = data.words || [];
            tbody.innerHTML = rows.map(w=>{
                // 生成構詞分析顯示
                let morphologyHtml = '<span style="color: #888; font-size: 0.8rem;">-</span>';
                if(w.morphology) {
                    const parts = [];
                    if(w.morphology.prefix) parts.push(`<span style="color: #6C5CE7; background: rgba(108, 92, 231, 0.1); padding: 2px 4px; border-radius: 3px; font-size: 0.75rem;">${w.morphology.prefix}-</span>`);
                    if(w.morphology.root) parts.push(`<span style="color: #2e7d32; background: rgba(46, 125, 50, 0.1); padding: 2px 4px; border-radius: 3px; font-size: 0.75rem;">${w.morphology.root}</span>`);
                    if(w.morphology.suffix) parts.push(`<span style="color: #e65100; background: rgba(230, 81, 0, 0.1); padding: 2px 4px; border-radius: 3px; font-size: 0.75rem;">-${w.morphology.suffix}</span>`);
                    if(parts.length > 0) morphologyHtml = parts.join(' ');
                }
                return `<tr data-id="${w.id}"><td><strong>${escapeHtml(w.english)}</strong></td><td>${escapeHtml(w.chinese)}</td><td><span class="badge-folder">${escapeHtml(w.folder)}</span></td><td>${morphologyHtml}</td><td>${w.error_count||0}</td><td><button class="btn-danger" data-id="${w.id}">刪除</button></td></tr>`;
            }).join('');
            // attach delete handlers
            tbody.querySelectorAll('button.btn-danger').forEach(b=>b.addEventListener('click',()=>onDeleteClicked(parseInt(b.dataset.id))));
        }catch(err){
            console.error(err); toast('載入單字失敗','error');
        }finally{ spinner.style.display='none'; }
    }

    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

    document.getElementById('mgmtPrev').addEventListener('click',()=>{
        if(mgmtState.page>1){ mgmtState.page--; loadManagement(); }
    });
    document.getElementById('mgmtNext').addEventListener('click',()=>{
        if(mgmtState.page*mgmtState.limit < mgmtState.total){ mgmtState.page++; loadManagement(); }
    });
    document.getElementById('mgmtPageSize').addEventListener('change',(e)=>{ mgmtState.limit = parseInt(e.target.value)||10; mgmtState.page=1; loadManagement(); });

    async function onDeleteClicked(id){
        if(!confirm('確定要刪除嗎？')) return;
        // optimistic: remove row
        const row = document.querySelector(`#mgmtTableBody tr[data-id='${id}']`);
        let backup = null;
        if(row){ backup = row.cloneNode(true); row.remove(); }
        const undoToast = document.createElement('div'); undoToast.className='toast'; undoToast.textContent='刪除中...'; document.body.appendChild(undoToast);
        try{
            await api(`/api/words/${id}`, {method:'DELETE'});
            undoToast.textContent = '已刪除'; setTimeout(()=>undoToast.remove(),1200);
            // reload counts/pagination
            loadManagement();
        }catch(err){
            undoToast.remove();
            if(backup){ document.getElementById('mgmtTableBody').prepend(backup); backup.querySelector('button.btn-danger').addEventListener('click',()=>onDeleteClicked(id)); }
            console.error(err); toast('刪除失敗','error');
        }
    }

    // Search with accessibility
    let searchTimer=0; let activeIndex=-1; let searchResults=[];
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');
    searchInput.setAttribute('role','combobox');
    searchInput.setAttribute('aria-haspopup','listbox');
    searchInput.addEventListener('input', (e)=>{
        clearTimeout(searchTimer); const kw = e.target.value.trim();
        if(!kw){ searchDropdown.style.display='none'; searchResults=[]; return; }
        searchDropdown.style.display='block'; searchDropdown.innerHTML = '<div aria-hidden="true">搜尋中…</div>';
        searchTimer = setTimeout(async ()=>{
            try{
                const words = await apiGet('/api/search?keyword='+encodeURIComponent(kw));
                searchResults = words.slice(0,12);
                if(!searchResults.length){ searchDropdown.innerHTML = `<div>${'無結果'}</div>`; return; }
                activeIndex = -1;
                searchDropdown.innerHTML = searchResults.map((w, idx)=>{
                    return `<div role="option" id="sr-${idx}" class="search-dropdown-item" data-idx="${idx}" tabindex="-1" style="padding:6px;border-bottom:1px solid rgba(255,255,255,0.02);display:flex;justify-content:space-between;align-items:center"><div><strong>${escapeHtml(w.english)}</strong><div style="color:#888;font-size:0.9rem">${escapeHtml(w.chinese)}</div></div><div class="badge-folder">${escapeHtml(w.folder)}</div></div>`;
                }).join('');
                // attach click
                searchDropdown.querySelectorAll('[data-idx]').forEach(el=>el.addEventListener('click', (ev)=>{
                    const idx = parseInt(el.dataset.idx); onSelectSearchResult(idx);
                }));
            }catch(err){ console.error(err); searchDropdown.innerHTML = `<div>搜尋失敗</div>`; }
        }, 250);
    });
    searchInput.addEventListener('keydown', (e)=>{
        if(searchDropdown.style.display==='none') return;
        if(e.key==='ArrowDown'){ e.preventDefault(); moveActive(1); }
        if(e.key==='ArrowUp'){ e.preventDefault(); moveActive(-1); }
        if(e.key==='Enter'){ e.preventDefault(); if(activeIndex>=0) onSelectSearchResult(activeIndex); }
        if(e.key==='Escape'){ searchDropdown.style.display='none'; }
    });
    function moveActive(delta){ const items = searchDropdown.querySelectorAll('[role="option"]'); if(!items.length) return; activeIndex = Math.max(0, Math.min(items.length-1, activeIndex+delta)); items.forEach((it, i)=>it.classList.toggle('active', i===activeIndex)); const id = items[activeIndex].id; searchInput.setAttribute('aria-activedescendant', id); items[activeIndex].scrollIntoView({block:'nearest'}); }
    function onSelectSearchResult(idx){ const w = searchResults[idx]; if(!w) return; searchDropdown.style.display='none'; toast(`選擇: ${w.english}`); }

    // Flashcards load
    document.getElementById('fcLoad').addEventListener('click', loadFlashcards);
    document.getElementById('fcLoadDue').addEventListener('click', loadDueFlashcards);
    // Hook new primary start button
    document.getElementById('fcStart').addEventListener('click', async ()=>{
        const btn = document.getElementById('fcStart');
        const sel = document.getElementById('fcFolder');
        const helper = document.getElementById('fcHelper');
        // If select is hidden, show options and populate
        if (sel && sel.style.display === 'none') {
            if (helper) helper.textContent = '選擇資料夾後開始學習';
            sel.style.display = 'inline-block';
            try {
                await loadFolderSelect('fcFolder');
                sel.focus();
                // attach a one-time change handler to auto-start when user selects
                const onChange = async function(){
                    try{
                        // hide helper and start
                        if (helper) helper.textContent = '';
                        await loadFlashcards();
                    }catch(e){ console.error(e); toast('載入 flashcards 失敗','error'); }
                    // remove this handler after triggered
                    sel.removeEventListener('change', onChange);
                };
                sel.addEventListener('change', onChange);
            } catch (e) {
                console.error(e); toast('載入資料夾失敗','error');
            }
            return;
        }
        // Otherwise start learning with selected folder
        btn.disabled = true; btn.style.opacity = 0.9;
        try {
            await loadFlashcards();
        } finally {
            btn.disabled = false; btn.style.opacity = 1;
        }
    });
    // Global start in header still calls loadFlashcards via inline onclick

    let flashWords = [];
    let flashIndex = 0;

    async function loadFlashcards(){
        const folder = document.getElementById('fcFolder').value || 'all';
        const spinner = document.getElementById('fcSpinner'); spinner.style.display='inline-block';
        try{
            const data = await apiGet('/api/words?folder='+encodeURIComponent(folder)+`&page=1&limit=500`);
            flashWords = data.words || [];
            flashIndex = 0;
            renderFlashCard();
            // focus the card area for keyboard users
            document.getElementById('fcArea').focus && document.getElementById('fcArea').focus();
        }catch(err){ console.error(err); toast('載入 flashcards 失敗','error'); }
        finally{ spinner.style.display='none'; }
    }

    async function loadDueFlashcards(){
        const folder = document.getElementById('fcFolder').value || 'all';
        const spinner = document.getElementById('fcSpinner'); spinner.style.display='inline-block';
        try{
            const data = await apiGet('/api/due?folder='+encodeURIComponent(folder)+`&page=1&limit=500`);
            flashWords = data.words || [];
            flashIndex = 0;
            renderFlashCard();
        }catch(err){ console.error(err); toast('載入 Due 單字 失敗','error'); }
        finally{ spinner.style.display='none'; }
    }

    function renderFlashCard(){
        const area = document.getElementById('fcArea');
        if(!flashWords || flashWords.length === 0){ area.innerHTML = '<div>沒有單字</div>'; return; }
        if(flashIndex >= flashWords.length){ area.innerHTML = `<div>已練習完 ${flashWords.length} 個單字</div>`; return; }
        const w = flashWords[flashIndex];
        // show simple card with two action buttons
        area.innerHTML = `
            <div style="padding:12px;border-radius:8px;background:rgba(255,255,255,0.02)" tabindex="0">
                <div style="font-size:1.25rem;font-weight:600">${escapeHtml(w.english)}</div>
                <div style="color:#B0B8C6;margin-top:6px">${escapeHtml(w.chinese)}</div>
                <div style="margin-top:8px;display:flex;gap:8px">
                    <button id="btnKnown" class="btn btn-secondary">我知道</button>
                    <button id="btnUnknown" class="btn btn-danger">我不會</button>
                </div>
                <div style="margin-top:8px;color:#888;font-size:0.85rem">第 ${flashIndex+1} / ${flashWords.length}</div>
            </div>
        `;
        document.getElementById('btnKnown').addEventListener('click', async ()=>{
            await submitReview(w.id, 5);
        });
        document.getElementById('btnUnknown').addEventListener('click', async ()=>{
            await submitReview(w.id, 2);
        });
    }

    async function submitReview(id, quality){
        try{
            await api(`/api/words/${id}/review`, {method:'PUT', body: JSON.stringify({quality}), headers: {'Content-Type':'application/json'}});
            flashIndex++;
            renderFlashCard();
        }catch(err){ console.error(err); toast('記錄評分失敗','error'); }
    }


    // Init
    (async function(){ await loadFolderSelect('mgmtFolder'); /* Do not auto-populate fcFolder to keep it empty until user clicks start */ document.getElementById('mgmtPageSize').value='10'; mgmtState.limit = 10; loadManagement(); })();
    </script>
</body>
</html>
